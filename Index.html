<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Chatbot</title>
  <!-- Load Puter.js Library for Free AI Access -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #007bff;
      color: #ffffff;
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background-color: #007bff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      align-self: flex-start;
      background-color: #e9ecef;
      color: #333333;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 12px;
      background: #ffffff;
      border-top: 1px solid #dee2e6;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ced4da;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      margin-left: 8px;
      padding: 10px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Free AI Assistant</div>
    <div class="chat-box" id="chatBox">
      <div class="message ai-message">Hello! How can I help you today?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');
      const userText = inputField.value.trim();

      if (!userText) return;

      // 1. Display User Message
      appendMessage(userText, 'user-message');
      inputField.value = '';
      
      // Disable input while AI is replying
      inputField.disabled = true;
      sendBtn.disabled = true;

      // 2. Display Placeholder for AI Response
      const aiMessageElement = appendMessage('Thinking...', 'ai-message');

      try {
        // 3. Call Free AI API (Using Puter.js)
        const response = await puter.ai.chat(userText);
        aiMessageElement.innerText = response.toString();
      } catch (error) {
        aiMessageElement.innerText = "Error: Unable to connect to free AI service.";
        console.error("AI Error:", error);
      } finally {
        // Re-enable input
        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${className}`;
      messageDiv.innerText = text;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return messageDiv;
    }
  </script>

</body>
</html>
